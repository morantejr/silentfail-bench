# mini-swe-agent overlay: FREE frontier-class generation via OpenRouter ($0 by
# construction: a `:free` model id cannot bill). Selection, audit and gold stay
# local. Merge on top of benchmarks/swebench_backticks.yaml.
#
# Key: NOT in this file, NOT in the repo. mini-swe-agent reads OPENROUTER_API_KEY
# from its global .env (~/Library/Application Support/mini-swe-agent/.env).
#
# Free tier limits (2026-09): ~20 req/min, ~50 req/day without purchased
# credits, ~1000/day with >= $10 lifetime credits. One 40-step trajectory fits
# the no-credit daily cap; a multi-instance pilot does not without credits.
agent:
  step_limit: 40        # leaves headroom under the ~50/day free cap
  cost_limit: 0         # nothing to cap on a free model; 0 disables the guard
  mode: yolo
environment:
  environment_class: docker
  run_args: ["--rm", "--platform", "linux/amd64"]
  pull_timeout: 900
  timeout: 120
model:
  model_class: openrouter_textbased     # same ```mswea_bash_command parser validated with the 7B
  model_name: qwen/qwen3.8-27b:free     # only free coder-class model with a long context (262k); glm-5.2:free is 32k
  cost_tracking: ignore_errors          # OpenRouter returns cost=0 for free models; the class raises on <=0 otherwise
  model_kwargs:
    temperature: 0.7
    # No provider pinning on the free tier: a free model may have a single
    # provider at capacity, and refusing fallbacks would fail the run outright.
    # Reproducibility caveat is accepted and logged for this smoke test.
