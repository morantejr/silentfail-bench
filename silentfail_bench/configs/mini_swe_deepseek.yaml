# mini-swe-agent overlay: DeepSeek V4.1 Flash (552B MoE, open weights), agent environment in a Modal sandbox.
# Amendment 10 capability pilot. Mentor-recommended open-weight agent.
#
# model_class is openrouter_textbased, NOT openrouter. The plain class sends
# function tools; gpt-6-luna rejected them and every trajectory died after three
# API calls with a misleading RepeatedFormatError (DEFECTS.md, instrument failure
# on the Amendment 6 pilot). The textbased class parses the action out of the
# model's own text with a regex, so a model that will not do tool calls still
# drives the scaffold.
#
# The API key is NOT stored here and must never be. Set it yourself:
#   mini-extra config set OPENROUTER_API_KEY <your key>
# which writes to mini-swe-agent's own .env outside this repository.
agent:
  step_limit: 40
  cost_limit: 0.25
  mode: yolo
environment:
  environment_class: swerex_modal
  cwd: /testbed
  timeout: 120
  startup_timeout: 600
  runtime_timeout: 3600
  deployment_timeout: 3600
model:
  # OpenRouter does not return a cost field for these models, and mini-swe-agent
  # hard-errors on that. Cost is instead computed from token counts times the
  # published per-million rates, which is auditable rather than vendor-reported.
  cost_tracking: ignore_errors
  model_class: openrouter_textbased
  model_name: deepseek/deepseek-v4.1-flash
  model_kwargs:
    # Without max_tokens, OpenRouter pre-authorises the model's FULL context
    # (131k for deepseek-v4.1-flash) against the account balance and returns
    # HTTP 402 before running anything. The scaffold then dies on KeyError:
    # 'choices' because the error payload has none. This is a reasoning model,
    # so the cap must leave room for reasoning tokens as well as the command.
    max_tokens: 16000
    # Pin the provider. OpenRouter routes across 28 hosts for these open weights
    # and picks the cheapest first, which is rate-limited (429) and correlated with
    # both the connection errors and the tool-call markup leaking into the text
    # channel from turn 0 in 10 of 21 trajectories. Morph is verified clean and has
    # the cheapest OUTPUT rate, which dominates for a reasoning model.
    #
    # max_tokens raised 4000 -> 16000: this model spends output budget on reasoning
    # BEFORE content, so a tight cap occasionally starves the action entirely and the
    # turn parses to zero actions. Three of 41 trajectories died that way.
    provider:
      order: [Morph, Sail Research, DeepInfra]
      allow_fallbacks: false
    drop_params: true
    temperature: 0.0
