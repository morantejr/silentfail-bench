[project]
name = "silentfail-bench"
version = "0.1.0"
description = "Stage-0 SilentFail-Bench: selection-conditional beyond-score detection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
data = ["datasets>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
